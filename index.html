<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWS Tactical AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #02a8ff;
      --accent-soft: rgba(2, 168, 255, 0.4);
      --hud: #66fcf1;
      --bg-panel: rgba(0, 0, 0, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Share Tech Mono', monospace;
    }

    #manual-start {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.18);
      color: var(--accent);
      font-weight: bold;
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }

    #manual-start.hidden {
      display: none;
    }

    #avatar-container {
      position: relative;
      width: 800px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: drift 6s ease-in-out infinite;
    }

    #ai-static {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0;
      filter: drop-shadow(0 0 15px var(--accent-soft));
      opacity: 1;
      transition: opacity 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    #ai-video {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 0;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .active-reaction #ai-static {
      opacity: 0;
    }

    .active-reaction #ai-video {
      opacity: 1;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #debug-log {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 400px;
      max-width: calc(100vw - 40px);
      background: var(--bg-panel);
      color: var(--hud);
      font-size: 11px;
      padding: 12px;
      border: 1px solid var(--accent);
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.4;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="manual-start">[ CLICK TO INITIALIZE AVATAR SYSTEM ]</div>

  <div id="avatar-container">
    <img id="ai-static" src="avatar.jpg" alt="AI Avatar">
    <video id="ai-video" playsinline preload="auto">
      <source src="2026-04-08 10-54-37.mp4" type="video/mp4">
    </video>
  </div>

  <div id="debug-log">>> AWS TACTICAL AI: INITIALIZING...</div>

  <script>
    const log = document.getElementById('debug-log');
    const container = document.getElementById('avatar-container');
    const video = document.getElementById('ai-video');
    const startOverlay = document.getElementById('manual-start');

    let systemInitialized = false;
    let autoLoopStarted = false;
    let autoInterval = null;
    let firstTriggerTimeout = null;

    function setLog(msg) {
      log.innerText = `>> ${msg}`;
    }

    function appendLog(msg) {
      log.innerHTML += `<br>>> ${msg}`;
    }

    async function initializeSystem() {
      if (systemInitialized) return;
      systemInitialized = true;

      startOverlay.classList.add('hidden');
      appendLog('ENGINE INITIALIZING...');

      try {
        video.volume = 1.0;
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('VIDEO SYSTEM: READY.');
      } catch (err) {
        appendLog('VIDEO PRELOAD WARNING.');
        console.error(err);
      }

      startAutoLoop();
    }

    function startAutoLoop() {
      if (autoLoopStarted) return;
      autoLoopStarted = true;

      appendLog('AUTO PROTOCOL ACTIVE (3 MIN INTERVAL)');

      firstTriggerTimeout = setTimeout(() => {
        appendLog('INITIAL AUTO TRIGGER EXECUTED');
        playReaction();
      }, 5000);

      autoInterval = setInterval(() => {
        appendLog('AUTO TRIGGER EXECUTED');
        playReaction();
      }, 180000);
    }

    function playReaction() {
      if (container.classList.contains('active-reaction')) return;

      container.classList.add('active-reaction');
      video.currentTime = 0;

      video.play().catch((err) => {
        appendLog('VIDEO PLAYBACK FAILED');
        console.error(err);
        container.classList.remove('active-reaction');
      });

      video.onended = () => {
        container.classList.remove('active-reaction');
        setLog('AWS TACTICAL AI: STANDBY');
      };
    }

    window.addEventListener('load', async () => {
      appendLog('SYSTEM READY');

      try {
        video.volume = 1.0;
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('AUTOPLAY UNLOCK: OK');
        startOverlay.classList.add('hidden');
        initializeSystem();
      } catch (e) {
        appendLog('INTERACTION REQUIRED TO START AUDIO/VIDEO');
        console.log(e);
      }
    });

    startOverlay.addEventListener('click', () => {
      initializeSystem();
    }, { once: true });
  </script>

</body>
</html>
