<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AWS Tactical AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; overflow: hidden; background: transparent; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Share Tech Mono', monospace; }
    #click-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: pointer; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); color: #02a8ff; font-weight: bold; text-align: center; padding: 20px; }
    #avatar-container { position: relative; width: 600px; height: 600px; display: flex; justify-content: center; align-items: center; animation: drift 6s ease-in-out infinite; }
    #ai-static { width: 90%; height: 90%; object-fit: cover; border-radius: 50%; filter: drop-shadow(0 0 15px rgba(2, 168, 255, 0.4)); opacity: 1; transition: opacity 0.5s ease; }
    #ai-video { position: absolute; width: 90%; height: 90%; border-radius: 50%; object-fit: cover; opacity: 0; transition: opacity 0.3s ease; }
    .active-reaction #ai-static { opacity: 0; }
    .active-reaction #ai-video { opacity: 1; }
    @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    #debug-log { position: absolute; bottom: 20px; left: 20px; width: 420px; background: rgba(0,0,0,0.9); color: #66fcf1; font-size: 11px; padding: 12px; border: 1px solid #02a8ff; text-transform: uppercase; pointer-events: none; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="click-shield" onclick="initializeAI()">[ CLICK TO SYNC AWS AI WITH RESTREAM ]</div>

  <div id="avatar-container">
    <img id="ai-static" src="avatar.jpg">
    <video id="ai-video" muted playsinline preload="auto">
      <source src="Lory apply_720p-white background.webm" type="video/webm">
    </video>
  </div>

  <div id="debug-log">>> AWS TACTICAL AI: STANDBY<br>>> WAITING FOR USER INITIALIZATION...</div>

  <script>
    const log = document.getElementById('debug-log');
    const shield = document.getElementById('click-shield');
    const container = document.getElementById('avatar-container');
    const video = document.getElementById('ai-video');

    function initializeAI() {
      shield.style.display = 'none';
      log.innerHTML += "<br>>> ENGINE INITIALIZING...";
      
      video.play().then(() => {
        video.pause();
        log.innerHTML += "<br>>> VIDEO SYSTEM: READY.";
        // Delaying connection slightly to ensure engine is clear
        setTimeout(connectRestream, 500);
      }).catch(e => {
        log.innerHTML += "<br>>> VIDEO ERROR: PLEASE CLICK AGAIN.";
      });
    }

   function connectRestream() {
      // Your verified token
      const embedToken = '3a4f3fc1-eaf1-404e-af74-770deb2a9cb7'; 
      
      log.innerHTML += "<br>>> INITIATING WEBSOCKET PROTOCOL...";
      
      try {
        // We add 'origin' handling to bypass local security blocks
        const socket = new WebSocket(`wss://chat.api.restream.io/embed?token=${embedToken}`);

        socket.onopen = () => {
          log.innerHTML += "<br>>> [SUCCESS] MULTI-CHAT LINK ESTABLISHED.";
        };

        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          if (data.action === 'message') {
            const author = data.payload.authorName;
            const text = data.payload.text || "";
            const platform = data.payload.platformIdentifier || 'stream';

            log.innerHTML = `> [${platform.toUpperCase()}] ${author}: ${text}`;

            if (text.toLowerCase().trim() === '!apply') {
              log.innerHTML += "<br>>> EXECUTING RECRUITMENT PROTOCOL...";
              playReaction();
            }
          }
        };

        socket.onerror = (err) => {
          log.innerHTML += "<br>>> CONNECTION ERROR: BROWSER SECURITY BLOCK.";
          console.log("Error details:", err);
        };

      } catch (error) {
        log.innerHTML += "<br>>> CRITICAL ERROR: " + error.message;
      }
    }

    function playReaction() {
      if (container.classList.contains('active-reaction')) return;
      container.classList.add('active-reaction');
      video.currentTime = 0;
      video.play();
      video.onended = () => {
        container.classList.remove('active-reaction');
        log.innerHTML = ">> AWS AI: STANDBY";
      };
    }
  </script>
</body>
</html>
