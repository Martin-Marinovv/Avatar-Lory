<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWS Tactical AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #02a8ff;
      --accent-soft: rgba(2, 168, 255, 0.4);
      --hud: #66fcf1;
      --bg-panel: rgba(0, 0, 0, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Share Tech Mono', monospace;
    }

    #avatar-container {
      position: relative;
      /* Changed width and height to 16:9 aspect ratio */
      width: 800px;
      height: 450px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: drift 6s ease-in-out infinite;
    }

    #ai-static {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Removed circular border-radius */
      border-radius: 0%;
      filter: drop-shadow(0 0 15px var(--accent-soft));
      opacity: 1;
      transition: opacity 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    #ai-video {
      position: absolute;
      width: 100%;
      height: 100%;
      /* Removed circular border-radius */
      border-radius: 0%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .active-reaction #ai-static {
      opacity: 0;
    }

    .active-reaction #ai-video {
      opacity: 1;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #debug-log {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 400px;
      background: var(--bg-panel);
      color: var(--hud);
      font-size: 11px;
      padding: 12px;
      border: 1px solid var(--accent);
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.4;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="avatar-container">
    <img id="ai-static" src="avatar.jpg" alt="AI Avatar">
    <video id="ai-video" playsinline preload="auto">
      <source src="2026-04-08 10-54-37.mp4" type="video/mp4">
    </video>
  </div>

  <div id="debug-log">>> AWS TACTICAL AI: INITIALIZING...</div>

  <script>
    const log = document.getElementById('debug-log');
    const container = document.getElementById('avatar-container');
    const video = document.getElementById('ai-video');

    function setLog(msg) {
      log.innerText = `>> ${msg}`;
    }

    function appendLog(msg) {
      log.innerHTML += `<br>>> ${msg}`;
    }

    async function initializeSystem() {
      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('VIDEO SYSTEM: READY.');
      } catch (err) {
        appendLog('VIDEO PRELOAD WARNING.');
      }

      startAutoLoop();
    }

    function startAutoLoop() {
      appendLog('AUTO PROTOCOL ACTIVE (3 MIN INTERVAL)');

      setTimeout(() => {
        playReaction();
      }, 5000);

      setInterval(() => {
        appendLog('AUTO TRIGGER EXECUTED');
        playReaction();
      }, 180000);
    }

    function playReaction() {
      if (container.classList.contains('active-reaction')) return;

      container.classList.add('active-reaction');
      video.currentTime = 0;

      video.play().catch(() => {
        appendLog('VIDEO PLAYBACK FAILED');
        container.classList.remove('active-reaction');
      });

      video.onended = () => {
        container.classList.remove('active-reaction');
        setLog('AWS TACTICAL AI: STANDBY');
      };
    }

    window.addEventListener('load', async () => {
      appendLog('SYSTEM READY');

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('AUTOPLAY UNLOCK: OK');
        initializeSystem();
      } catch (e) {
        appendLog('INTERACTION REQUIRED TO START AUDIO/VIDEO');
        window.addEventListener('click', () => {
          initializeSystem();
        }, { once: true });
      }
    });
  </script>
</body>
</html>
