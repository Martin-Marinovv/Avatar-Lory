<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWS Tactical AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #02a8ff;
      --accent-soft: rgba(2, 168, 255, 0.4);
      --hud: #66fcf1;
      --bg-panel: rgba(0, 0, 0, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Share Tech Mono', monospace;
    }

    #avatar-container {
      position: relative;
      width: 600px;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: drift 6s ease-in-out infinite;
    }

    #ai-static {
      width: 90%;
      height: 90%;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 0 15px var(--accent-soft));
      opacity: 1;
      transition: opacity 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    #ai-video {
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .active-reaction #ai-static {
      opacity: 0;
    }

    .active-reaction #ai-video {
      opacity: 1;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    #debug-log {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 460px;
      max-width: calc(100vw - 40px);
      background: var(--bg-panel);
      color: var(--hud);
      font-size: 11px;
      padding: 12px;
      border: 1px solid var(--accent);
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.45;
    }

    #manual-start {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.18);
      color: var(--accent);
      font-weight: bold;
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }

    #manual-start.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="manual-start">[ CLICK TO INITIALIZE AVATAR SYSTEM ]</div>

  <div id="avatar-container">
    <img id="ai-static" src="avatar.jpg" alt="AI Avatar">

    <video id="ai-video" muted playsinline preload="auto">
      <source src="Lory apply_720p-white background.webm" type="video/webm">
    </video>
  </div>

  <div id="debug-log">
    >> AWS TACTICAL AI: STANDBY<br>
    >> SYSTEM READY
  </div>

  <script>
    const log = document.getElementById('debug-log');
    const startOverlay = document.getElementById('manual-start');
    const container = document.getElementById('avatar-container');
    const video = document.getElementById('ai-video');

    let initialized = false;

    function appendLog(message) {
      log.innerHTML += `<br>>> ${message}`;
    }

    function setLog(message) {
      log.innerHTML = `>> ${message}`;
    }

    async function initializeAI() {
      if (initialized) return;
      initialized = true;

      startOverlay.classList.add('hidden');
      appendLog('ENGINE INITIALIZING...');

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('VIDEO SYSTEM: READY.');
      } catch (err) {
        appendLog('VIDEO PRELOAD WARNING.');
      }

      startAutoLoop();
    }

    function startAutoLoop() {
      appendLog('AUTO PROTOCOL ACTIVE (3 MIN INTERVAL)');

      // First trigger after 5 seconds (optional)
      setTimeout(() => {
        playReaction();
      }, 5000);

      // Then every 3 minutes
      setInterval(() => {
        appendLog('AUTO TRIGGER EXECUTED');
        playReaction();
      }, 180000); // 3 minutes
    }

    function playReaction() {
      if (container.classList.contains('active-reaction')) return;

      container.classList.add('active-reaction');
      video.currentTime = 0;

      video.play().catch(() => {
        appendLog('VIDEO PLAYBACK FAILED');
        container.classList.remove('active-reaction');
      });

      video.onended = () => {
        container.classList.remove('active-reaction');
        setLog('AWS TACTICAL AI: STANDBY');
      };
    }

    window.addEventListener('load', async () => {
      appendLog('SYSTEM READY');

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('AUTOPLAY UNLOCK: OK');
        startOverlay.classList.add('hidden');
        await initializeAI();
      } catch {
        appendLog('AWAITING USER INITIALIZATION');
      }
    });

    startOverlay.addEventListener('click', initializeAI);
  </script>

</body>
</html>
