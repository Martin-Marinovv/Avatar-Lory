<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AWS Tactical AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #02a8ff;
      --accent-soft: rgba(2, 168, 255, 0.4);
      --hud: #66fcf1;
      --bg-panel: rgba(0, 0, 0, 0.9);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Share Tech Mono', monospace;
    }

    #avatar-container {
      position: relative;
      width: 600px;
      height: 600px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: drift 6s ease-in-out infinite;
    }

    #ai-static {
      width: 90%;
      height: 90%;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 0 15px var(--accent-soft));
      opacity: 1;
      transition: opacity 0.5s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    #ai-video {
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .active-reaction #ai-static {
      opacity: 0;
    }

    .active-reaction #ai-video {
      opacity: 1;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    #debug-log {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 460px;
      max-width: calc(100vw - 40px);
      background: var(--bg-panel);
      color: var(--hud);
      font-size: 11px;
      padding: 12px;
      border: 1px solid var(--accent);
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.45;
      white-space: normal;
    }

    #manual-start {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.18);
      color: var(--accent);
      font-weight: bold;
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }

    #manual-start.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div id="manual-start">[ CLICK TO INITIALIZE AVATAR SYSTEM ]</div>

  <div id="avatar-container">
    <img id="ai-static" src="avatar.jpg" alt="AI Avatar">

    <video id="ai-video" muted playsinline preload="auto">
      <source src="Lory apply_720p-white background.webm" type="video/webm">
    </video>
  </div>

  <div id="debug-log">
    &gt;&gt; AWS TACTICAL AI: STANDBY<br>
    &gt;&gt; LOADING VISUAL SYSTEMS...
  </div>

  <script>
    const log = document.getElementById('debug-log');
    const startOverlay = document.getElementById('manual-start');
    const container = document.getElementById('avatar-container');
    const video = document.getElementById('ai-video');

    let socket = null;
    let initialized = false;

    function appendLog(message) {
      log.innerHTML += `<br>>> ${message}`;
    }

    function setLog(message) {
      log.innerHTML = `>> ${message}`;
    }

    async function initializeAI() {
      if (initialized) return;
      initialized = true;

      startOverlay.classList.add('hidden');
      appendLog('ENGINE INITIALIZING...');

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('VIDEO SYSTEM: READY.');
      } catch (err) {
        appendLog('VIDEO PRELOAD WARNING: USER INTERACTION MAY BE REQUIRED.');
        console.error('Video preload error:', err);
      }

      await connectRestream();
    }

    async function connectRestream() {
      appendLog('USING DIRECT ACCESS TOKEN FOR TEST...');

      try {
        // PASTE YOUR FRESH RESTREAM OAUTH ACCESS TOKEN HERE
        const accessToken = 'https://chat.restream.io/embed?token=3a4f3fc1-eaf1-404e-af74-770deb2a9cb7';

        if (!accessToken || accessToken === 'PASTE_YOUR_ACCESS_TOKEN_HERE') {
          appendLog('NO ACCESS TOKEN SET IN INDEX.HTML');
          return;
        }

        appendLog('INITIATING WEBSOCKET PROTOCOL...');

        socket = new WebSocket(
          `wss://chat.api.restream.io/ws?accessToken=${encodeURIComponent(accessToken)}`
        );

        socket.onopen = () => {
          appendLog('[SUCCESS] MULTI-CHAT LINK ESTABLISHED.');
        };

        socket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            console.log('Restream message:', data);

            if (data.action === 'message' && data.payload) {
              const author = data.payload.authorName || 'unknown';
              const text = data.payload.text || '';
              const platform = data.payload.platformIdentifier || 'stream';

              log.innerHTML = `> [${platform.toUpperCase()}] ${author}: ${escapeHtml(text)}`;

              if (text.trim().toLowerCase() === '!apply') {
                appendLog('EXECUTING RECRUITMENT PROTOCOL...');
                playReaction();
              }
            }
          } catch (err) {
            appendLog('MESSAGE PARSE WARNING.');
            console.error('Message parse error:', err);
          }
        };

        socket.onerror = (err) => {
          appendLog('CONNECTION ERROR: INVALID OR EXPIRED TOKEN.');
          console.error('WebSocket error:', err);
        };

        socket.onclose = (event) => {
          appendLog(`SOCKET CLOSED: CODE ${event.code}.`);
        };

      } catch (error) {
        appendLog(`CONNECT FAILED: ${error.message}`);
        console.error(error);
      }
    }

    function playReaction() {
      if (container.classList.contains('active-reaction')) return;

      container.classList.add('active-reaction');
      video.currentTime = 0;

      video.play().catch(err => {
        appendLog('VIDEO PLAYBACK FAILED.');
        console.error('Video play error:', err);
        container.classList.remove('active-reaction');
      });

      video.onended = () => {
        container.classList.remove('active-reaction');
        setLog('AWS TACTICAL AI: STANDBY');
      };
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('load', async () => {
      appendLog('SYSTEM READY.');

      try {
        await video.play();
        video.pause();
        video.currentTime = 0;
        appendLog('AUTOPLAY UNLOCK: OK.');
        startOverlay.classList.add('hidden');
        await initializeAI();
      } catch (err) {
        appendLog('AWAITING MANUAL USER INITIALIZATION...');
        console.log('Autoplay/manual init required:', err);
      }
    });

    startOverlay.addEventListener('click', initializeAI);
  </script>
</body>
</html>
